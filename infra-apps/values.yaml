spec:
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/Gin-G/argo-k8s-stuff
    targetRevision: main
"argo-cd":
  enable: true
  targetRevision: 9.3.7
"argo-rollouts":
  enable: true
  targetRevision: 2.40.5
"cert-manager":
  enable: true
  targetRevision: 1.20.2
cloudflared:
  # Plain manifests, so no chart version to track.
  # Credentials are in OpenBao at kv/cloudflared/tunnel and the UUID is set in
  # manifests/cloudflared/cloudflared-configmap.yaml, so this is safe to run.
  # The tunnel carries no traffic until a hostname's DNS is a CNAME to it.
  enable: true
cnpg:
  enable: true
  targetRevision: 0.27.0
"external-secrets":
  enable: true
  targetRevision: 1.3.1
externaldns:
  enable: true
  targetRevision: 1.20.0
gateway-api:
  enable: false
homepage:
  enable: true
  targetRevision: 4.6.0
lgtm:
  enable: true
  targetRevision: 3.0.1
nginx:
  enable: false
  targetRevision: 4.14.2
openbao:
  enable: true
  targetRevision: 0.25.6
"openbao-bootstrap":
  # One-shot Job that configures the Kubernetes auth method in OpenBao.
  # Ran successfully on 2026-07-30; auth/kubernetes, the external-secrets-read
  # policy and the external-secrets role are all in place. Flip back to true to
  # re-run - the script is idempotent. See manifests/openbao-bootstrap/README.md.
  enable: false
  # Namespace the Job runs in - must already contain the openbao-credentials
  # secret whose OPENBAO_TOKEN can write sys/policy and auth/.
  namespace: nickknows
prometheus:
  enable: true
  targetRevision: 81.3.1
promtail:
  targetRevision: 6.16.6
rook-ceph:
  enable: true
  targetRevision: v1.19.0
traefik:
  enable: true
  targetRevision: 39.0.8
"argo-workflows":
  enable: false
  targetRevision: 0.42.5
backstage:
  enable: false
  targetRevision: 2.2.0
buildkit:
  enable: false
  targetRevision: 0.8.0
harbor:
  enable: false
  targetRevision: 1.16.0
nvidia:
  enable: true
  targetRevision: 0.18.2
  operatorRevision: v25.10.1
rancher:
  enable: false