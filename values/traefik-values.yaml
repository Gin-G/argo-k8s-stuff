providers:
  kubernetesIngressNginx:
    enabled: true
service:
  enabled: true
  type: LoadBalancer
  externalTrafficPolicy: Local
logs:
  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultMode: drop
        names:
          X-Forwarded-For: keep
          # Set by Cloudflare's edge to the real client IP. Logged next to XFF
          # to see what each hop does to the source address.
          Cf-Connecting-Ip: keep
ports:
  web:
    forwardedHeaders:
      trustedIPs:
        - 10.0.0.0/8
    transport:
      respondingTimeouts:
        readTimeout: 30m
        writeTimeout: 30m
        idleTimeout: 30m
  websecure:
    forwardedHeaders:
      trustedIPs:
        - 10.0.0.0/8
    transport:
      respondingTimeouts:
        readTimeout: 30m
        writeTimeout: 30m
        idleTimeout: 30m