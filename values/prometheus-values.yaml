prometheus:
  ingress:
    enabled: true
    annotations: {
      nginx.ingress.kubernetes.io/ssl-redirect: "true",
      nginx.ingress.kubernetes.io/ssl-passthrough: "false",
      cert-manager.io/cluster-issuer: "letsencrypt-cloudflare",
      kubernetes.io/ingress-class: nginx,
      external-dns.alpha.kubernetes.io/target: "8.44.158.127"
    }
    ingressClassName: "nginx"
    hosts: ["prometheus.nickknows.net"]
    tls:
    - secretName: prometheus.nickknows.net-tls
      hosts:
        - prometheus.nickknows.net
  prometheusSpec:
    # Keep Prometheus off gingworker (4 vCPU / 7.6 GB) -- it was the largest
    # consumer there (~1.3 GB, unbounded) on a node already at 94% mem requests.
    # Hard rule: never gingworker. Soft preference: gingmachine (283 GB RAM).
    # Left schedulable on ging-laptop so a gingmachine outage doesn't strand it.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - gingworker
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - gingmachine
    remoteWrite:
      - url: http://lgtm-mimir-distributor.lgtm.svc.cluster.local:8080/api/v1/push
        headers:
          X-Scope-OrgID: mimir-continuous-test
        name: mimir

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true
