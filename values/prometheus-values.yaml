prometheus:
  # No ingress on purpose. The Prometheus UI has no authentication of its own,
  # so publishing it put the full query API on the internet -- /api/v1 answered
  # anyone, exposing ~2,173 metric names as an inventory of the whole cluster.
  #
  # Nothing depended on it: Grafana reaches Mimir and Prometheus over in-cluster
  # service DNS, never the public hostname. Day-to-day querying happens in
  # Grafana anyway, and for the rare direct look:
  #   kubectl port-forward -n prometheus svc/prometheus-kube-prometheus-prometheus 9090:9090
  ingress:
    enabled: false
  prometheusSpec:
    # Sized from observed behaviour on 2026-08-18, not guesswork:
    #   ~186.8k active head series (stable, not growing)
    #   steady-state working set ~1.1-1.4Gi
    #   peak working set 1881Mi over 6h  <- the 2h compaction spike
    # request 2Gi sits just above the real peak so the scheduler reserves
    # honestly (it previously requested nothing while burning 1.3Gi).
    # limit 4Gi is ~2.1x peak: headroom for WAL replay on restart, query
    # bursts and series growth. Deliberately generous -- the TSDB is
    # emptyDir, so an OOMKill loses all history and can start a crash loop.
    # CPU limit is loose on purpose (observed 80-216m): CPU throttling
    # delays scrapes and rule evaluation, which is worse than the overcommit.
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Keep Prometheus off gingworker (4 vCPU / 7.6 GB) -- it was the largest
    # consumer there (~1.3 GB, unbounded) on a node already at 94% mem requests.
    # Hard rule: never gingworker. Soft preference: gingmachine (283 GB RAM).
    # Left schedulable on ging-laptop so a gingmachine outage doesn't strand it.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - gingworker
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - gingmachine
    remoteWrite:
      - url: http://lgtm-mimir-distributor.lgtm.svc.cluster.local:8080/api/v1/push
        headers:
          X-Scope-OrgID: mimir-continuous-test
        name: mimir

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true
  # Applies to every config-reloader sidecar the operator injects (Prometheus
  # and Alertmanager). Observed usage: 11Mi / ~0m, so this is pure guardrail.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 128Mi
