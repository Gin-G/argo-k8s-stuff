# Research Pool, role hub+site: the hub, plus this cluster as its first site,
# in one release -- short public test, then disabled.
# Chart: oci://hub.k8s.ucar.edu/ncote/research-pool (version in personal/values.yaml).
#
# Prerequisites, all in manifests/research-pool/ (the research-pool-prereqs app):
#   - Secret research-pool-oidc            client-id / client-secret, from OpenBao kv/research-pool/oidc
#   - ConfigMap research-pool-recovery     recovery.pub, the PUBLIC half of the offline recovery key
#   - ConfigMap research-pool-identity-map Google sub -> POSIX identity for this site
#   - Argo CD repository Secret            lets Argo pull the chart from Harbor over OCI
#
# Joining this cluster (ADR-0015, chart >= 0.1.0-rc.2): engine.site.localJoin
# is on by default for hub+site, so there's no invitation and no code. Sign in
# as an operator and approve the join request marked "this hub's own cluster".
# Remote sites still use invitation -> code -> approval (ADR-0014).
#
# The hub and agent images are pinned by digest in the released chart's own
# defaults, so nothing is set under `images:` here. The Harbor project is
# public: no pull secret.

role: hub+site

global:
  clusterName: homelab
  baseDomain: nickknows.net
  # Host names default to pool.<baseDomain> and pool-agents.<baseDomain>, one
  # level deep so Cloudflare's Universal SSL certificate covers them at the edge.

engine:
  hub:
    publicURL: https://pool.nickknows.net
    # Google `sub` values. Seeding applies only while the hub has no operators;
    # after that, operators are added from the console.
    bootstrapOperators:
      - "111747131414504260066"   # Nick (Google)
    enrollment:
      invitationTTL: 72h
    tunnel:
      # Sessions (ADR-0016) need this: it gives the hub its session host
      # pattern, s-<id>.nickknows.net (sessionHostTemplate's default). Off, the
      # hub has no session hosts and launch links come out without a domain.
      # It also adds *.nickknows.net to the chart's Ingress, so DNS gets a
      # wildcard record to the tunnel; see platform.ingress below for why that
      # Ingress isn't routed.
      enabled: true
    signing:
      recoveryPublicKeyRef: { name: research-pool-recovery, key: recovery.pub }
    database:
      # A CloudNativePG Cluster from the chart, run by the cnpg operator already
      # in this cluster. Its data goes away when the app is disabled (pruned).
      mode: bundled
      bundled:
        size: 2Gi
        storageClass: rook-ceph-block
  site:
    name: homelab
    # The agent reaches its own hub the way a remote site does: through the
    # tunnel and Traefik, not an in-cluster shortcut.
    hubURL: https://pool-agents.nickknows.net

researchPool:
  auth:
    provider: oidc
    issuer: https://accounts.google.com
    existingSecret: research-pool-oidc
  identityMapping:
    provider: static
    static:
      ref: { kind: ConfigMap, name: research-pool-identity-map, key: map.yaml }
  # No datasets yet: enrollment is what's under test.
  datasets: []

platform:
  ingress:
    mode: ingress
    # Parked: no IngressClass by this name exists, so neither Traefik provider
    # routes this Ingress. external-dns and cert-manager still read it (DNS for
    # pool., pool-agents., *.nickknows.net, and the certificates).
    #   - Its *.nickknows.net rule would outrank every Host() rule on this
    #     Traefik (priority = rule length), so it can't go to Traefik.
    #   - pool. and pool-agents. are routed by
    #     manifests/research-pool/ingressroute.yaml instead.
    #   - Session hosts go from cloudflared straight to the hub's Service.
    className: research-pool-unrouted
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      # Both host names (pool., pool-agents.) become CNAMEs to the tunnel.
      external-dns.alpha.kubernetes.io/target: 75c20a42-2dd1-4297-8a51-3aefbcb3f004.cfargotunnel.com
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    tls:
      # Issued by cert-manager's ingress-shim from the annotation above; one
      # certificate covering both host names.
      existingSecret: research-pool-tls
      # Its own certificate for the *.nickknows.net entry, so cert-manager
      # doesn't see two TLS entries sharing one Secret. Nothing serves it
      # today: session traffic reaches the hub over plain HTTP from
      # cloudflared, and Cloudflare's edge certificate covers the browser side.
      sessionsExistingSecret: research-pool-sessions-tls
  scheduling:
    # Off ging-laptop: its kubelet isn't reachable from the API server, so
    # logs and exec there fail with a 502. (The CNPG database pod isn't
    # covered by these; the chart has no scheduling values for it.)
    hub:
      nodeSelector:
        kubernetes.io/hostname: gingworker
    # Agent and its preflight Job.
    agent:
      nodeSelector:
        kubernetes.io/hostname: gingworker
