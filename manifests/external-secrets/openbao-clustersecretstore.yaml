---
# Cluster-wide OpenBao backend authenticated with the Kubernetes auth method.
#
# Deliberately named differently from the existing per-namespace `openbao-backend`
# SecretStores so the two can run side by side. Migrate an app by pointing its
# ExternalSecret at this store:
#
#   secretStoreRef:
#     name: openbao-k8s-backend
#     kind: ClusterSecretStore
#
# No per-namespace SecretStore and no manually created OPENBAO_TOKEN secret are
# needed. See README.md in this directory for the one-time OpenBao setup.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-k8s-backend
  annotations:
    # Wave 1 so the ESO chart (CRDs + validating webhook) is healthy first.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          # Matches `bao auth enable kubernetes` (auth/kubernetes).
          mountPath: kubernetes
          # Matches `auth/kubernetes/role/external-secrets` in OpenBao.
          role: external-secrets
          serviceAccountRef:
            name: openbao-auth
            namespace: external-secrets
