---
# Identity that External Secrets presents to OpenBao's Kubernetes auth method.
# This ServiceAccount never gets a long-lived token and is never mounted into a
# pod - ESO mints a short-lived token for it through the TokenRequest API every
# time it needs to log in to OpenBao.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth
  namespace: external-secrets
---
# Allows the ESO controller to call TokenRequest for the openbao-auth SA above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-auth-token-creator
  namespace: external-secrets
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["openbao-auth"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-auth-token-creator
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-auth-token-creator
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
